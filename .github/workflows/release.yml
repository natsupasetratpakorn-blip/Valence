name: Release

# Runs on every push to main or this branch. The release is named after the version in pom.xml,
# so pushing again with the same version just refreshes that release's jar.
on:
  push:
    branches:
      - main
      - claude/valence-team-plugin
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: mvn -B package
      - name: Read version
        id: version
        run: echo "version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Valence ${{ steps.version.outputs.version }}
          files: target/Valence-*.jar
          body: |
            Valence, a dialog based team plugin by M4sh3r.

            Works on Paper and Folia 1.21 to 26.3. Dialog menus need 1.21.7 or newer; older versions get chat menus.
            Drop the jar into your plugins folder. Vault (or VaultUnlocked on Folia) is needed for the team bank. See the README for MySQL network setup.
