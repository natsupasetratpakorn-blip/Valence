name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: mvn -B package
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Valence ${{ github.ref_name }}
          files: target/Valence-*.jar
          body: |
            Valence, a dialog based team plugin by M4sh3r.

            Works on Paper and Folia 1.21 to 26.3. Dialog menus need 1.21.7 or newer; older versions get chat menus.
            Drop the jar into your plugins folder. Vault (or VaultUnlocked on Folia) is needed for the team bank.
